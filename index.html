<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>곱셈·나눗셈 스피드 퀴즈</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(160deg, #fff7d6, #d9f2ff);
    display: flex; align-items: center; justify-content: center;
    color: #333;
  }
  .card {
    width: 92%; max-width: 480px; background: #fff;
    border-radius: 24px; padding: 28px 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12); text-align: center;
  }
  h1 { font-size: 1.7rem; margin: 0 0 8px; }
  p { margin: 6px 0; }
  .hidden { display: none; }
  .levels { display: grid; gap: 12px; margin-top: 20px; }
  button {
    font-family: inherit; font-size: 1.2rem; font-weight: bold;
    border: none; border-radius: 16px; padding: 14px; cursor: pointer;
    transition: transform 0.1s;
  }
  button:active { transform: scale(0.96); }
  .lv1 { background: #b8f0c8; } .lv2 { background: #ffe08a; } .lv3 { background: #ffc2c2; }
  .main-btn { background: #4a90e2; color: #fff; width: 100%; margin-top: 16px; }
  .top { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: bold; }
  .timer-bar { height: 12px; background: #eee; border-radius: 6px; margin: 12px 0 20px; overflow: hidden; }
  .timer-fill { height: 100%; width: 100%; background: #4a90e2; transition: width 1s linear; }
  .question { font-size: 3rem; font-weight: bold; margin: 10px 0 20px; }
  input {
    width: 100%; font-size: 2rem; text-align: center; padding: 10px;
    border: 3px solid #4a90e2; border-radius: 16px; outline: none;
  }
  .feedback { font-size: 1.5rem; height: 2rem; margin-top: 12px; font-weight: bold; }
  .good { color: #2e9e4f; } .bad { color: #e04848; }
  .big-score { font-size: 4rem; font-weight: bold; color: #4a90e2; margin: 10px 0; }
</style>
</head>
<body>
<div class="card">

  <!-- 시작 화면 -->
  <div id="start">
    <h1>⚡ 스피드 계산 퀴즈</h1>
    <p>60초 동안 몇 문제나 맞힐 수 있을까요?</p>
    <div class="levels">
      <button class="lv1" onclick="startGame(1)">🌱 쉬움: 구구단</button>
      <button class="lv2" onclick="startGame(2)">🌿 보통: 두 자리 × 한 자리</button>
      <button class="lv3" onclick="startGame(3)">🌳 어려움: 나눗셈</button>
    </div>
  </div>

  <!-- 게임 화면 -->
  <div id="game" class="hidden">
    <div class="top">
      <span>⏰ <span id="time">60</span>초</span>
      <span>⭐ <span id="score">0</span>점</span>
    </div>
    <div class="timer-bar"><div class="timer-fill" id="bar"></div></div>
    <div class="question" id="question"></div>
    <input id="answer" type="text" inputmode="numeric" autocomplete="off" placeholder="정답 입력">
    <button class="main-btn" onclick="checkAnswer()">확인</button>
    <div class="feedback" id="feedback"></div>
  </div>

  <!-- 결과 화면 -->
  <div id="result" class="hidden">
    <h1>🎉 끝!</h1>
    <div class="big-score"><span id="final">0</span>점</div>
    <p id="detail"></p>
    <p id="best"></p>
    <button class="main-btn" onclick="showStart()">다시 하기</button>
  </div>

</div>

<script>
  // ===== 설정: 여기 숫자만 바꾸면 돼요 =====
  const GAME_SECONDS = 60;   // 제한 시간(초)
  const POINT = 10;          // 한 문제당 점수

  let level, answer, score, correct, wrong, timeLeft, timer;

  function rand(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function makeQuestion() {
    let a, b;
    if (level === 1) {            // 구구단
      a = rand(2, 9); b = rand(2, 9);
      answer = a * b;
      return a + " × " + b;
    } else if (level === 2) {     // 두 자리 × 한 자리
      a = rand(11, 99); b = rand(2, 9);
      answer = a * b;
      return a + " × " + b;
    } else {                      // 나눗셈 (나누어떨어지는 것만)
      b = rand(2, 9); answer = rand(2, 12);
      a = b * answer;
      return a + " ÷ " + b;
    }
  }

  function show(id) {
    ["start", "game", "result"].forEach(s =>
      document.getElementById(s).classList.toggle("hidden", s !== id));
  }

  function startGame(lv) {
    level = lv; score = 0; correct = 0; wrong = 0; timeLeft = GAME_SECONDS;
    document.getElementById("score").textContent = 0;
    document.getElementById("time").textContent = timeLeft;
    document.getElementById("bar").style.width = "100%";
    document.getElementById("feedback").textContent = "";
    show("game");
    nextQuestion();
    timer = setInterval(tick, 1000);
  }

  function tick() {
    timeLeft--;
    document.getElementById("time").textContent = timeLeft;
    document.getElementById("bar").style.width = (timeLeft / GAME_SECONDS * 100) + "%";
    if (timeLeft <= 0) endGame();
  }

  function nextQuestion() {
    document.getElementById("question").textContent = makeQuestion();
    const input = document.getElementById("answer");
    input.value = "";
    input.focus();
  }

  function checkAnswer() {
    const input = document.getElementById("answer");
    if (input.value.trim() === "") return;
    const fb = document.getElementById("feedback");
    if (Number(input.value) === answer) {
      score += POINT; correct++;
      fb.textContent = "⭕ 정답!"; fb.className = "feedback good";
    } else {
      wrong++;
      fb.textContent = "❌ 정답은 " + answer; fb.className = "feedback bad";
    }
    document.getElementById("score").textContent = score;
    nextQuestion();
  }

  function endGame() {
    clearInterval(timer);
    document.getElementById("final").textContent = score;
    document.getElementById("detail").textContent = "맞힌 문제 " + correct + "개 · 틀린 문제 " + wrong + "개";
    let best = 0;
    try {
      const key = "best-level-" + level;
      best = Number(localStorage.getItem(key)) || 0;
      if (score > best) { best = score; localStorage.setItem(key, score); }
    } catch (e) {}
    document.getElementById("best").textContent = "🏆 이 기기 최고 기록: " + best + "점";
    show("result");
  }

  function showStart() { show("start"); }

  document.getElementById("answer").addEventListener("keydown", e => {
    if (e.key === "Enter") checkAnswer();
  });
</script>
</body>
</html>
